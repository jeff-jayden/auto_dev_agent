[project]
name = "ai-dev-agent"
version = "0.1.0"
description = "A controllable autonomous software-delivery agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34",
  "pillow>=11.0",
  "langchain>=1.0,<2.0",
  "langchain-deepseek>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ui_validation"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
