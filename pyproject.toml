[project]
name = "ai-dev-agent"
version = "0.1.0"
description = "A controllable vertical-slice demo of an autonomous development agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34",
  "pillow>=11.0",
  "langchain>=1.0,<2.0",
  "langchain-deepseek>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
